[workspace]
members = [
  "crates/vibe-hauler",
  "crates/vibe-hauler-adapters",
  "crates/vibe-hauler-cleaner",
  "crates/vibe-hauler-config",
  "crates/vibe-hauler-core",
  "crates/vibe-hauler-discovery",
  "crates/vibe-hauler-fixtures",
  "crates/vibe-hauler-parsers",
  "crates/vibe-hauler-redaction",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/zerob13/VibeHauler"
homepage = "https://github.com/zerob13/VibeHauler"
authors = ["zerob13"]
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
hex = "0.4"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.9"
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
